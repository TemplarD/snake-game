<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'>
<title>Snake Game</title>
<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 0.5rem;
    color: #fff;
  }
  
  /* Difficulty buttons */
  #difficultyPanel {
    display: flex;
    gap: 0.4rem;
    padding: 0.4rem;
    background: rgba(255,255,255,0.1);
    border-radius: 8px;
    margin-bottom: 0.4rem;
  }
  #difficultyPanel button {
    padding: 0.35rem 0.6rem;
    font-size: clamp(0.7rem, 1.8vw, 0.85rem);
    border: 2px solid transparent;
    border-radius: 6px;
    background: rgba(255,255,255,0.15);
    color: #fff;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  #difficultyPanel button:hover {
    background: rgba(255,255,255,0.25);
  }
  #difficultyPanel button.active {
    border-color: #4ade80;
    background: rgba(74, 222, 128, 0.3);
  }
  #difficultyPanel button.easy { border-color: #22c55e; }
  #difficultyPanel button.medium { border-color: #fbbf24; }
  #difficultyPanel button.hard { border-color: #ef4444; }

  /* Score panel */
  #scorePanel {
    display: flex;
    gap: 0.8rem;
    padding: 0.4rem 0.8rem;
    background: rgba(255,255,255,0.1);
    border-radius: 8px;
    margin-bottom: 0.4rem;
    font-size: clamp(0.85rem, 2.2vw, 1.1rem);
  }
  #scorePanel span {
    display: flex;
    align-items: center;
    gap: 0.3rem;
  }
  #scorePanel .label {
    color: #aaa;
  }
  #scorePanel .value {
    font-weight: bold;
    color: #4ade80;
  }
  #scorePanel .value.high {
    color: #fbbf24;
  }

  /* Game container */
  #gameContainer {
    width: 100%;
    max-width: min(600px, 90vw);
    aspect-ratio: 1/1;
    position: relative;
    margin: 0.4rem 0;
  }
  canvas {
    background: #fff;
    border: 3px solid #4ade80;
    border-radius: 8px;
    display: block;
    width: 100%;
    height: 100%;
    box-shadow: 0 4px 20px rgba(74, 222, 128, 0.3);
  }

  /* Controls */
  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    justify-content: center;
    width: 100%;
    max-width: min(600px, 90vw);
    margin-top: 0.4rem;
  }
  #controls button {
    flex: 1 1 calc(20% - 0.4rem);
    min-width: 65px;
    padding: 0.6rem 0.4rem;
    font-size: clamp(0.7rem, 1.8vw, 0.9rem);
    border: none;
    border-radius: 8px;
    background: linear-gradient(145deg, #3b82f6, #2563eb);
    color: #fff;
    cursor: pointer;
    touch-action: manipulation;
    transition: all 0.2s;
    font-weight: 500;
  }
  #controls button:hover {
    background: linear-gradient(145deg, #2563eb, #1d4ed8);
    transform: translateY(-2px);
  }
  #controls button:active {
    transform: translateY(0);
  }
  #controls button.active {
    background: linear-gradient(145deg, #10b981, #059669);
  }
  #controls button.danger {
    background: linear-gradient(145deg, #ef4444, #dc2626);
  }
  #controls button.danger:hover {
    background: linear-gradient(145deg, #dc2626, #b91c1c);
  }

  /* Description */
  #desc {
    margin-top: 0.4rem;
    text-align: center;
    color: #aaa;
    font-size: clamp(0.7rem, 1.8vw, 0.85rem);
    max-width: 600px;
    padding: 0 1rem;
  }

  /* Touch controls - smaller and positioned higher */
  #touchControls {
    position: fixed;
    bottom: max(2%, env(safe-area-inset-bottom, 2%));
    left: 50%;
    transform: translateX(-50%);
    display: grid;
    grid-template-areas: 
      ". up ."
      "left . right"
      ". down .";
    grid-gap: 0.2rem;
    visibility: hidden;
    pointer-events: none;
    z-index: 100;
  }
  #touchControls.visible {
    visibility: visible;
    pointer-events: auto;
  }
  #touchControls button {
    width: clamp(40px, 9vw, 55px);
    height: clamp(40px, 9vw, 55px);
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    background: rgba(74, 222, 128, 0.3);
    color: #fff;
    border: 2px solid rgba(74, 222, 128, 0.5);
    border-radius: 50%;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.1s;
  }
  #touchControls button:active {
    background: rgba(74, 222, 128, 0.6);
    transform: scale(0.95);
  }
  #touchControls #upBtn { grid-area: up; }
  #touchControls #downBtn { grid-area: down; }
  #touchControls #leftBtn { grid-area: left; }
  #touchControls #rightBtn { grid-area: right; }

  /* Overlay (Game Over) */
  #overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.3s ease;
    border-radius: 8px;
  }
  #overlay.visible {
    visibility: visible;
    opacity: 1;
  }
  #overlay h1 {
    font-size: clamp(1.8rem, 7vw, 2.8rem);
    color: #ef4444;
    margin-bottom: 0.8rem;
    text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  #overlay #finalScore {
    font-size: clamp(1.1rem, 3.5vw, 1.4rem);
    margin-bottom: 0.4rem;
  }
  #overlay #finalHighScore {
    font-size: clamp(0.95rem, 3vw, 1.15rem);
    color: #fbbf24;
    margin-bottom: 0.4rem;
  }
  #overlay #finalDifficulty {
    font-size: clamp(0.85rem, 2.5vw, 1rem);
    color: #aaa;
    margin-bottom: 1.2rem;
  }
  #overlay button {
    padding: 0.9rem 1.8rem;
    font-size: clamp(0.95rem, 2.8vw, 1.15rem);
    background: linear-gradient(145deg, #10b981, #059669);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.2s;
  }
  #overlay button:hover {
    transform: scale(1.05);
  }

  /* Modal (Scores) */
  #modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 1000;
  }
  #modal.visible {
    visibility: visible;
    opacity: 1;
  }
  #modalContent {
    background: linear-gradient(145deg, #1e293b, #0f172a);
    padding: 1.5rem;
    border-radius: 16px;
    text-align: center;
    border: 2px solid #4ade80;
    box-shadow: 0 10px 40px rgba(74, 222, 128, 0.3);
    max-width: 90vw;
    width: min(400px, 95vw);
    max-height: 75vh;
    overflow-y: auto;
  }
  #modalContent h2 {
    font-size: clamp(1.4rem, 4.5vw, 1.8rem);
    margin-bottom: 1.2rem;
    color: #fbbf24;
  }
  
  /* Scores table */
  #scoresTable {
    width: 100%;
    border-collapse: collapse;
    font-size: clamp(0.85rem, 2.5vw, 1rem);
  }
  #scoresTable th, #scoresTable td {
    padding: 0.6rem 0.4rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    text-align: center;
  }
  #scoresTable th {
    color: #fbbf24;
    font-weight: 600;
    position: sticky;
    top: 0;
    background: #1e293b;
  }
  #scoresTable tr:hover {
    background: rgba(255,255,255,0.05);
  }
  #scoresTable .rank { color: #aaa; width: 30px; }
  #scoresTable .score { color: #4ade80; font-weight: bold; }
  #scoresTable .difficulty { font-size: 0.85em; }
  #scoresTable .difficulty.easy { color: #22c55e; }
  #scoresTable .difficulty.medium { color: #fbbf24; }
  #scoresTable .difficulty.hard { color: #ef4444; }
  
  #modalContent button {
    margin-top: 1.2rem;
    padding: 0.7rem 1.8rem;
    font-size: clamp(0.95rem, 2.8vw, 1.1rem);
    background: linear-gradient(145deg, #3b82f6, #2563eb);
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
  }
  #modalContent button:hover {
    background: linear-gradient(145deg, #2563eb, #1d4ed8);
  }

  /* Responsive adjustments */
  @media (max-width: 480px) {
    html, body {
      padding: 0.25rem;
    }
    #difficultyPanel {
      gap: 0.3rem;
      padding: 0.3rem;
    }
    #difficultyPanel button {
      padding: 0.3rem 0.5rem;
      font-size: 0.75rem;
    }
    #scorePanel {
      gap: 0.5rem;
      padding: 0.35rem 0.6rem;
      font-size: 0.85rem;
    }
    #controls {
      gap: 0.25rem;
    }
    #controls button {
      min-width: 60px;
      padding: 0.5rem 0.25rem;
      font-size: 0.75rem;
    }
    #touchControls {
      bottom: max(1%, env(safe-area-inset-bottom, 1%));
      grid-gap: 0.15rem;
    }
    #touchControls button {
      width: clamp(38px, 8.5vw, 50px);
      height: clamp(38px, 8.5vw, 50px);
      font-size: 1.1rem;
    }
  }
</style>
</head>
<body>

<!-- Difficulty Panel -->
<div id="difficultyPanel">
  <button data-difficulty="easy" data-i18n="easy">Лёгкий</button>
  <button data-difficulty="medium" data-i18n="medium" class="active">Средний</button>
  <button data-difficulty="hard" data-i18n="hard">Сложный</button>
</div>

<!-- Score Panel -->
<div id="scorePanel">
  <span><span class="label" data-i18n="scoreLabel">Счёт:</span> <span class="value" id="currentScore">0</span></span>
  <span><span class="label" data-i18n="bestLabel">Рекорд:</span> <span class="value high" id="highScore">0</span></span>
</div>

<!-- Game Container -->
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  
  <!-- Game Over Overlay -->
  <div id="overlay">
    <h1 data-i18n="gameOver">GAME OVER</h1>
    <div id="finalScore">Score: 0</div>
    <div id="finalHighScore">Best: 0</div>
    <div id="finalDifficulty">Difficulty: Medium</div>
    <button id="restartOverlayBtn" data-i18n="restart">Restart</button>
  </div>
</div>

<!-- Touch Controls (swipe buttons) -->
<div id="touchControls">
  <button id="upBtn">↑</button>
  <button id="leftBtn">←</button>
  <button id="rightBtn">→</button>
  <button id="downBtn">↓</button>
</div>

<!-- Control Buttons -->
<div id="controls">
  <button id="restartBtn" data-i18n="restart">Restart</button>
  <button id="pauseBtn" data-i18n="pause">Pause</button>
  <button id="scoresBtn" data-i18n="scores">Рекорды</button>
  <button id="langToggleBtn">RU</button>
  <button id="toggleTouchBtn" data-i18n="touch">Touch: OFF</button>
</div>

<!-- Description -->
<p id="desc"></p>

<!-- Scores Modal -->
<div id="modal">
  <div id="modalContent">
    <h2 data-i18n="highScores">Рекорды</h2>
    <table id="scoresTable">
      <thead>
        <tr>
          <th data-i18n="rank">#</th>
          <th data-i18n="score">Счёт</th>
          <th data-i18n="difficulty">Сложность</th>
        </tr>
      </thead>
      <tbody id="scoresTableBody">
        <!-- Scores will be populated dynamically -->
      </tbody>
    </table>
    <button id="closeModalBtn" data-i18n="close">Закрыть</button>
  </div>
</div>

<script>
  // ====================== CONFIG ======================
  const DIFFICULTIES = {
    easy: {
      name: 'easy',
      baseSpeed: 300,
      minSpeed: 100,
      speedDecrement: 5,
      label: { ru: 'Лёгкий', en: 'Easy' },
      class: 'easy'
    },
    medium: {
      name: 'medium',
      baseSpeed: 200,
      minSpeed: 50,
      speedDecrement: 10,
      label: { ru: 'Средний', en: 'Medium' },
      class: 'medium'
    },
    hard: {
      name: 'hard',
      baseSpeed: 120,
      minSpeed: 30,
      speedDecrement: 15,
      label: { ru: 'Сложный', en: 'Hard' },
      class: 'hard'
    }
  };

  const SETTINGS = {
    gridSize: 20,
    minBox: 15,
    maxBox: 30,
    defaultDifficulty: 'medium',
    locale: 'ru',
    maxScores: 10,
    texts: {
      ru: {
        scoreLabel: 'Счёт:',
        bestLabel: 'Рекорд:',
        score: 'Счёт',
        best: 'Рекорд',
        rank: '#',
        difficulty: 'Сложность',
        gameOver: 'GAME OVER',
        restart: 'Играть снова',
        pause: 'Пауза',
        resume: 'Продолжить',
        scores: 'Рекорды',
        highScores: 'Таблица рекордов',
        touch: 'Touch: ',
        touchOn: 'ВКЛ',
        touchOff: 'ВЫКЛ',
        close: 'Закрыть',
        easy: 'Лёгкий',
        medium: 'Средний',
        hard: 'Сложный',
        difficultyLabel: 'Сложность:',
        desc: 'Стрелки, свайпы или тапы для управления. Собирай еду, избегай стен и хвоста!'
      },
      en: {
        scoreLabel: 'Score:',
        bestLabel: 'Best:',
        score: 'Score',
        best: 'Best',
        rank: '#',
        difficulty: 'Difficulty',
        gameOver: 'GAME OVER',
        restart: 'Play Again',
        pause: 'Pause',
        resume: 'Resume',
        scores: 'Scores',
        highScores: 'High Scores',
        touch: 'Touch: ',
        touchOn: 'ON',
        touchOff: 'OFF',
        close: 'Close',
        easy: 'Easy',
        medium: 'Medium',
        hard: 'Hard',
        difficultyLabel: 'Difficulty:',
        desc: 'Use arrows, swipes or taps to control. Collect food, avoid walls and tail!'
      }
    }
  };

  // ====================== STATE ======================
  const state = {
    canvas: null,
    ctx: null,
    box: 20,
    gridSize: SETTINGS.gridSize,
    snake: [],
    food: {},
    direction: 'right',
    nextDirection: 'right',
    score: 0,
    highScore: 0,
    gameRunning: true,
    isPaused: false,
    isGameOver: false,
    intervalId: null,
    speed: DIFFICULTIES.medium.baseSpeed,
    difficulty: SETTINGS.defaultDifficulty,
    locale: SETTINGS.locale,
    currentTexts: SETTINGS.texts[SETTINGS.locale],
    useTouchControls: false,
    touchStartX: 0,
    touchStartY: 0,
    lastTouchTime: 0
  };

  // ====================== UTILITIES ======================
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);

  function getDifficultySettings() {
    return DIFFICULTIES[state.difficulty];
  }

  // Load all scores from localStorage
  function loadAllScores() {
    const allScores = [];
    for (const diff of ['easy', 'medium', 'hard']) {
      const key = `snakeScores_${diff}`;
      const saved = localStorage.getItem(key);
      if (saved) {
        const scores = JSON.parse(saved);
        scores.forEach(s => {
          allScores.push({ ...s, difficulty: diff });
        });
      }
    }
    // Sort by score descending
    allScores.sort((a, b) => b.score - a.score);
    return allScores.slice(0, SETTINGS.maxScores);
  }

  // Load high score for current difficulty
  function loadHighScore() {
    const key = `snakeHighScore_${state.difficulty}`;
    const saved = localStorage.getItem(key);
    state.highScore = saved ? parseInt(saved, 10) : 0;
    updateScoreDisplay();
  }

  function saveHighScore() {
    if (state.score > state.highScore) {
      state.highScore = state.score;
      const key = `snakeHighScore_${state.difficulty}`;
      localStorage.setItem(key, state.highScore.toString());
    }
    
    // Save to scores table
    saveToScoresTable(state.score, state.difficulty);
    
    updateScoreDisplay();
  }

  function saveToScoresTable(score, difficulty) {
    const key = `snakeScores_${difficulty}`;
    const saved = localStorage.getItem(key);
    let scores = saved ? JSON.parse(saved) : [];
    
    scores.push({ score, difficulty, date: Date.now() });
    scores.sort((a, b) => b.score - a.score);
    scores = scores.slice(0, SETTINGS.maxScores);
    
    localStorage.setItem(key, JSON.stringify(scores));
  }

  function updateScoreDisplay() {
    $('#currentScore').textContent = state.score;
    $('#highScore').textContent = state.highScore;
  }

  function calculateBoxSize() {
    const container = state.canvas.parentElement;
    const maxSize = Math.min(container.clientWidth, container.clientHeight);
    let box = Math.floor(maxSize / state.gridSize);
    box = Math.max(SETTINGS.minBox, Math.min(SETTINGS.maxBox, box));
    return box;
  }

  // ====================== CORE LOGIC ======================
  function init() {
    state.canvas = $('#gameCanvas');
    state.ctx = state.canvas.getContext('2d');
    
    setupDifficultyButtons();
    loadHighScore();
    setupKeyboard();
    setupButtons();
    setupTouchGestures();
    setupTouchControls();
    
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    updateDesc();
    spawnFood();
    startGameLoop();
  }

  function setupDifficultyButtons() {
    $$('#difficultyPanel button').forEach(btn => {
      btn.addEventListener('click', () => {
        const difficulty = btn.dataset.difficulty;
        setDifficulty(difficulty);
      });
    });
  }

  function setDifficulty(difficulty) {
    if (!DIFFICULTIES[difficulty]) return;
    
    state.difficulty = difficulty;
    
    $$('#difficultyPanel button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.difficulty === difficulty);
    });
    
    loadHighScore();
    restartGame();
  }

  function resizeCanvas() {
    state.box = calculateBoxSize();
    const size = state.box * state.gridSize;
    state.canvas.width = size;
    state.canvas.height = size;
    
    if (state.snake.length === 0) {
      resetSnake();
    }
    
    draw();
  }

  function resetSnake() {
    const startX = Math.floor(state.gridSize / 2) * state.box;
    const startY = Math.floor(state.gridSize / 2) * state.box;
    state.snake = [{ x: startX, y: startY }];
    state.direction = 'right';
    state.nextDirection = 'right';
  }

  // -------------------- Keyboard --------------------
  function setupKeyboard() {
    window.addEventListener('keydown', e => {
      if (!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) return;
      e.preventDefault();
      e.stopPropagation();
      setDirection(e.key);
    }, { passive: false });
  }

  function setDirection(key) {
    const map = {
      ArrowUp: 'up',
      ArrowDown: 'down',
      ArrowLeft: 'left',
      ArrowRight: 'right'
    };
    
    const newDir = map[key];
    if (!newDir) return;
    
    const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
    if (state.direction === opposites[newDir]) return;
    if (state.nextDirection === opposites[newDir]) return;
    
    state.nextDirection = newDir;
  }

  // -------------------- Buttons --------------------
  function setupButtons() {
    $('#restartBtn').onclick = restartGame;
    $('#pauseBtn').onclick = togglePause;
    $('#scoresBtn').onclick = openScoresModal;
    $('#langToggleBtn').onclick = toggleLanguage;
    $('#toggleTouchBtn').onclick = toggleTouchControls;
    $('#restartOverlayBtn').onclick = restartGame;
    $('#closeModalBtn').onclick = closeScoresModal;
  }

  function toggleTouchControls() {
    state.useTouchControls = !state.useTouchControls;
    const tc = $('#touchControls');
    tc.classList.toggle('visible', state.useTouchControls);
    $('#toggleTouchBtn').textContent = state.currentTexts.touch + 
      (state.useTouchControls ? state.currentTexts.touchOn : state.currentTexts.touchOff);
    $('#toggleTouchBtn').classList.toggle('active', state.useTouchControls);
  }

  function setupTouchControls() {
    const directions = {
      upBtn: 'ArrowUp',
      downBtn: 'ArrowDown',
      leftBtn: 'ArrowLeft',
      rightBtn: 'ArrowRight'
    };
    
    Object.entries(directions).forEach(([id, key]) => {
      const btn = document.getElementById(id);
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        setDirection(key);
      });
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        setDirection(key);
      });
    });
  }

  // -------------------- Touch Gestures --------------------
  function setupTouchGestures() {
    state.canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
    state.canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
    state.canvas.addEventListener('touchmove', preventTouchScroll, { passive: false });
  }

  function preventTouchScroll(e) {
    e.preventDefault();
  }

  function handleTouchStart(e) {
    e.preventDefault();
    const touch = e.changedTouches[0];
    state.touchStartX = touch.clientX;
    state.touchStartY = touch.clientY;
    state.lastTouchTime = Date.now();
  }

  function handleTouchEnd(e) {
    e.preventDefault();
    const touch = e.changedTouches[0];
    const dx = touch.clientX - state.touchStartX;
    const dy = touch.clientY - state.touchStartY;
    const elapsed = Date.now() - state.lastTouchTime;
    
    const minSwipe = 20;  // Уменьшено с 30 для большей чувствительности
    const maxTapTime = 200;  // Уменьшено с 250 для более быстрого отклика
    const tapThreshold = 20;  // Увеличено с 15 для более надёжного определения тапа
    
    // Tap detection - более быстрая обработка
    if (elapsed < maxTapTime && Math.abs(dx) < tapThreshold && Math.abs(dy) < tapThreshold) {
      handleTapOnCanvas(touch.clientX, touch.clientY);
      return;
    }
    
    // Swipe detection - уменьшенный порог
    if (Math.abs(dx) < minSwipe && Math.abs(dy) < minSwipe) return;
    
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? 'ArrowRight' : 'ArrowLeft');
    } else {
      setDirection(dy > 0 ? 'ArrowDown' : 'ArrowUp');
    }
    
    state.touchStartX = 0;
    state.touchStartY = 0;
  }

  function handleTapOnCanvas(tapX, tapY) {
    const head = state.snake[0];
    const rect = state.canvas.getBoundingClientRect();
    
    // Calculate head position relative to canvas
    const headX = rect.left + (head.x / state.canvas.width) * rect.width;
    const headY = rect.top + (head.y / state.canvas.height) * rect.height;
    
    // Calculate tap position relative to head
    const relX = tapX - headX;
    const relY = tapY - headY;
    
    const absRelX = Math.abs(relX);
    const absRelY = Math.abs(relY);
    
    const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
    const currentDir = state.direction;
    
    // For EASY difficulty: tap anywhere on the screen side
    // For MEDIUM/HARD: tap relative to head position
    let tapDirection;
    
    if (state.difficulty === 'easy') {
      // Easy mode: divide canvas into 4 quadrants from center
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      
      const fromCenterX = tapX - centerX;
      const fromCenterY = tapY - centerY;
      
      // Более надёжное определение направления
      if (Math.abs(fromCenterX) > Math.abs(fromCenterY)) {
        tapDirection = fromCenterX > 0 ? 'right' : 'left';
      } else {
        tapDirection = fromCenterY > 0 ? 'down' : 'up';
      }
    } else {
      // Medium/Hard: relative to head
      if (absRelX > absRelY) {
        tapDirection = relX > 0 ? 'right' : 'left';
      } else {
        tapDirection = relY > 0 ? 'down' : 'up';
      }
    }
    
    // Filter opposite direction - немедленная смена направления
    if (tapDirection && tapDirection !== opposites[currentDir]) {
      const keyMap = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
      // Прямое изменение nextDirection для мгновенного отклика
      state.nextDirection = keyMap[tapDirection];
    }
  }

  // -------------------- Game Flow --------------------
  function spawnFood() {
    const cols = state.canvas.width / state.box;
    const rows = state.canvas.height / state.box;
    
    let newFood;
    do {
      newFood = {
        x: Math.floor(Math.random() * cols) * state.box,
        y: Math.floor(Math.random() * rows) * state.box,
      };
    } while (state.snake.some(seg => seg.x === newFood.x && seg.y === newFood.y));
    
    state.food = newFood;
  }

  function startGameLoop() {
    if (state.intervalId) {
      clearInterval(state.intervalId);
    }
    const diffSettings = getDifficultySettings();
    state.speed = diffSettings.baseSpeed;
    state.intervalId = setInterval(gameStep, state.speed);
  }

  function gameStep() {
    if (!state.gameRunning || state.isPaused) return;

    state.direction = state.nextDirection;

    const head = { x: state.snake[0].x, y: state.snake[0].y };
    
    switch (state.direction) {
      case 'up':    head.y -= state.box; break;
      case 'down':  head.y += state.box; break;
      case 'left':  head.x -= state.box; break;
      case 'right': head.x += state.box; break;
    }

    if (head.x < 0 || head.x >= state.canvas.width || head.y < 0 || head.y >= state.canvas.height) {
      gameOver();
      return;
    }
    
    if (state.snake.some(seg => seg.x === head.x && seg.y === head.y)) {
      gameOver();
      return;
    }

    state.snake.unshift(head);

    if (head.x === state.food.x && head.y === state.food.y) {
      state.score++;
      updateScoreDisplay();
      saveHighScore();
      spawnFood();
      
      const diffSettings = getDifficultySettings();
      state.speed = Math.max(diffSettings.minSpeed, state.speed - diffSettings.speedDecrement);
      clearInterval(state.intervalId);
      state.intervalId = setInterval(gameStep, state.speed);
    } else {
      state.snake.pop();
    }

    draw();
  }

  function draw() {
    const ctx = state.ctx;
    const width = state.canvas.width;
    const height = state.canvas.height;
    const box = state.box;

    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, width, height);
    
    ctx.fillStyle = '#f0f9f0';
    for (let x = 0; x < width; x += box) {
      for (let y = 0; y < height; y += box) {
        if (((x / box + y / box) % 2) === 0) {
          ctx.fillRect(x, y, box, box);
        }
      }
    }
    
    state.snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#22c55e' : '#4ade80';
      ctx.fillRect(seg.x + 1, seg.y + 1, box - 2, box - 2);
      
      if (i === 0) {
        ctx.fillStyle = '#000';
        const eyeSize = box / 6;
        const eyeOffset = box / 3;
        
        let eye1x, eye1y, eye2x, eye2y;
        switch (state.direction) {
          case 'up':
            eye1x = seg.x + eyeOffset; eye1y = seg.y + eyeOffset;
            eye2x = seg.x + box - eyeOffset - eyeSize; eye2y = seg.y + eyeOffset;
            break;
          case 'down':
            eye1x = seg.x + eyeOffset; eye1y = seg.y + box - eyeOffset - eyeSize;
            eye2x = seg.x + box - eyeOffset - eyeSize; eye2y = seg.y + box - eyeOffset - eyeSize;
            break;
          case 'left':
            eye1x = seg.x + eyeOffset; eye1y = seg.y + eyeOffset;
            eye2x = seg.x + eyeOffset; eye2y = seg.y + box - eyeOffset - eyeSize;
            break;
          case 'right':
            eye1x = seg.x + box - eyeOffset - eyeSize; eye1y = seg.y + eyeOffset;
            eye2x = seg.x + box - eyeOffset - eyeSize; eye2y = seg.y + box - eyeOffset - eyeSize;
            break;
        }
        ctx.fillRect(eye1x, eye1y, eyeSize, eyeSize);
        ctx.fillRect(eye2x, eye2y, eyeSize, eyeSize);
      }
    });
    
    ctx.fillStyle = '#ef4444';
    const foodPadding = 2;
    ctx.fillRect(
      state.food.x + foodPadding,
      state.food.y + foodPadding,
      box - foodPadding * 2,
      box - foodPadding * 2
    );
    
    ctx.fillStyle = '#fca5a5';
    ctx.fillRect(
      state.food.x + foodPadding + 2,
      state.food.y + foodPadding + 2,
      box / 4,
      box / 4
    );
  }

  function gameOver() {
    state.gameRunning = false;
    state.isGameOver = true;
    
    if (state.intervalId) {
      clearInterval(state.intervalId);
      state.intervalId = null;
    }
    
    saveHighScore();
    
    const diffSettings = getDifficultySettings();
    $('#finalScore').textContent = `${state.currentTexts.scoreLabel.replace(':', '')}: ${state.score}`;
    $('#finalHighScore').textContent = `${state.currentTexts.bestLabel.replace(':', '')}: ${state.highScore}`;
    $('#finalDifficulty').textContent = `${state.currentTexts.difficultyLabel} ${diffSettings.label[state.locale]}`;
    $('#overlay').classList.add('visible');
  }

  function restartGame() {
    state.score = 0;
    state.direction = 'right';
    state.nextDirection = 'right';
    state.gameRunning = true;
    state.isPaused = false;
    state.isGameOver = false;
    
    if (state.intervalId) {
      clearInterval(state.intervalId);
    }
    
    resetSnake();
    spawnFood();
    startGameLoop();
    
    updateScoreDisplay();
    updatePauseButton();
    
    $('#overlay').classList.remove('visible');
    draw();
  }

  function togglePause() {
    if (!state.gameRunning || state.isGameOver) return;
    
    state.isPaused = !state.isPaused;
    updatePauseButton();
    
    if (state.isPaused) {
      if (state.intervalId) {
        clearInterval(state.intervalId);
        state.intervalId = null;
      }
    } else {
      state.intervalId = setInterval(gameStep, state.speed);
    }
  }

  function updatePauseButton() {
    const btn = $('#pauseBtn');
    btn.textContent = state.isPaused ? state.currentTexts.resume : state.currentTexts.pause;
    btn.classList.toggle('active', state.isPaused);
  }

  function toggleLanguage() {
    state.locale = state.locale === 'ru' ? 'en' : 'ru';
    state.currentTexts = SETTINGS.texts[state.locale];
    updateLocalization();
  }

  function updateLocalization() {
    const t = state.currentTexts;

    $('#langToggleBtn').textContent = state.locale === 'ru' ? 'RU' : 'EN';
    $('#restartBtn').textContent = t.restart;
    $('#pauseBtn').textContent = state.isPaused ? t.resume : t.pause;
    $('#scoresBtn').textContent = t.scores;
    $('#toggleTouchBtn').textContent = t.touch +
      (state.useTouchControls ? t.touchOn : t.touchOff);
    $('#restartOverlayBtn').textContent = t.restart;
    $('#closeModalBtn').textContent = t.close;
    
    // Update score panel labels
    $$('span.label[data-i18n="scoreLabel"]').forEach(el => {
      el.textContent = t.scoreLabel;
    });
    $$('span.label[data-i18n="bestLabel"]').forEach(el => {
      el.textContent = t.bestLabel;
    });

    $$('#difficultyPanel button').forEach(btn => {
      const diff = btn.dataset.difficulty;
      btn.textContent = t[diff];
    });

    $('#overlay h1').textContent = t.gameOver;
    const diffSettings = getDifficultySettings();
    $('#finalScore').textContent = `${t.scoreLabel.replace(':', '')}: ${state.score}`;
    $('#finalHighScore').textContent = `${t.bestLabel.replace(':', '')}: ${state.highScore}`;
    $('#finalDifficulty').textContent = `${t.difficultyLabel} ${diffSettings.label[state.locale]}`;

    $('#modalContent h2').textContent = t.highScores;

    // Update table headers
    const tableThs = $('#scoresTable thead tr').children;
    tableThs[0].textContent = t.rank;
    tableThs[1].textContent = t.score;
    tableThs[2].textContent = t.difficulty;

    updateDesc();

    // Refresh scores table if modal is open
    if ($('#modal').classList.contains('visible')) {
      populateScoresTable();
    }
  }

  function updateDesc() {
    $('#desc').textContent = state.currentTexts.desc;
  }

  // -------------------- Modal (Scores) --------------------
  function populateScoresTable() {
    const allScores = loadAllScores();
    const tbody = $('#scoresTableBody');
    tbody.innerHTML = '';
    
    const t = state.currentTexts;
    
    if (allScores.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3" style="color: #aaa; padding: 1rem;">No scores yet</td></tr>`;
      return;
    }
    
    allScores.forEach((entry, index) => {
      const diffSettings = DIFFICULTIES[entry.difficulty];
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="rank">${index + 1}</td>
        <td class="score">${entry.score}</td>
        <td class="difficulty ${diffSettings.class}">${diffSettings.label[t.locale === 'ru' ? 'ru' : 'en']}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function openScoresModal() {
    if (state.gameRunning && !state.isPaused && !state.isGameOver) {
      togglePause();
    }
    
    populateScoresTable();
    $('#modal').classList.add('visible');
  }

  function closeScoresModal() {
    $('#modal').classList.remove('visible');
  }

  $('#modal').addEventListener('click', (e) => {
    if (e.target === $('#modal')) {
      closeScoresModal();
    }
  });

  // ====================== BOOTSTRAP ======================
  window.snakeGame = { state, SETTINGS, DIFFICULTIES };
  
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
</script>
</body>
</html>
